name: Daily 3D Lottery Data Update

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 urllib3

      - name: Check existing database
        run: |
          if [ -f lottery_data.db ]; then
            echo "Database exists, size: $(stat -c%s lottery_data.db) bytes"
            sqlite3 lottery_data.db "SELECT COUNT(*) as total, MAX(period) as latest FROM history3d;"
          else
            echo "No database file found, will create new one"
          fi

      - name: Run data update
        run: python update_data.py

      - name: Verify update result
        run: |
          if [ -f lottery_data.db ]; then
            echo "Database after update, size: $(stat -c%s lottery_data.db) bytes"
            sqlite3 lottery_data.db "SELECT COUNT(*) as total, MAX(period) as latest FROM history3d;"
          else
            echo "ERROR: Database file not found after update!"
            exit 1
          fi

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update 3D lottery data [skip ci]"
          file_pattern: lottery_data.db
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"